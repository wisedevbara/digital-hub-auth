[package]
name = "digital-hub-auth-api"
version = "1.0.0"
edition = "2021"

[dependencies]
actix-web = "4.15.0"
actix-files = "0.6"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = "0.11"
log = "0.4"
# Used by the /api/flow proxy and /api/authorize/entry to talk to Authentik.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }