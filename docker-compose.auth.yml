networks:
  digital-hub-net:
    name: digital-hub-net
    external: true

services:
  server:
    image: ghcr.io/goauthentik/server:2026.8.3
    container_name: authentik_server
    restart: unless-stopped
    command: ["server"]
    networks:
      - digital-hub-net
    env_file:
      - .env
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL}
      AUTHENTIK_POSTGRESQL__HOST: postgres-auth
      AUTHENTIK_POSTGRESQL__PORT: "5432"
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: ${POSTGRES_DB}
      AUTHENTIK_POSTGRESQL__CONN_MAX_AGE: "300"
      AUTHENTIK_REDIS__HOST: redis-auth
      AUTHENTIK_REDIS__PORT: "6379"
      AUTHENTIK_REDIS__PASSWORD: ${REDIS_PASSWORD}
      # The CSRF token itself lives in the session instead of a separate cookie.
      # The custom SPA drives the flow executor through a same-origin proxy, so
      # it never sees authentik's own CSRF cookie.
      AUTHENTIK_CSRF_USE_SESSIONS: "true"
      # AUTHENTIK_COOKIE_DOMAIN is deliberately NOT set.
      #
      # The flow plan is stored in the Django session, so the session cookie is
      # load-bearing: without it every POST to the executor builds a fresh plan
      # and the consent token never matches ("Invalid consent token"). Setting the
      # domain to "localhost" makes Django emit "Domain=localhost" without a port,
      # which browsers reject, leaving django_session empty. Host-only cookies are
      # correct here anyway since the SPA is served same-origin via the nginx
      # /idp proxy.
    ports:
      - "9001:9000"
    depends_on:
      - postgres-auth
      - redis-auth

  worker:
    image: ghcr.io/goauthentik/server:2026.8.3
    container_name: authentik_worker
    restart: unless-stopped
    command: ["worker"]
    networks:
      - digital-hub-net
    env_file:
      - .env
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgres-auth
      AUTHENTIK_POSTGRESQL__PORT: "5432"
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: ${POSTGRES_DB}
      AUTHENTIK_REDIS__HOST: redis-auth
      AUTHENTIK_REDIS__PORT: "6379"
      AUTHENTIK_REDIS__PASSWORD: ${REDIS_PASSWORD}
      # The CSRF token itself lives in the session instead of a separate cookie.
      AUTHENTIK_CSRF_USE_SESSIONS: "true"
      # AUTHENTIK_COOKIE_DOMAIN is deliberately NOT set - see the note on the
      # server service. The flow plan lives in the Django session, so a rejected
      # session cookie breaks every executor round trip.
    depends_on:
      - postgres-auth
      - redis-auth

  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres_auth
    restart: unless-stopped
    networks:
      digital-hub-net:
        aliases:
          - postgres-auth
    env_file:
      - .env
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_app_data:/var/lib/postgresql/data

  redis-auth:
    image: redis:8.2
    container_name: redis_auth
    restart: unless-stopped
    networks:
      digital-hub-net:
        aliases:
          - redis-auth
    env_file:
      - .env
    ports:
      - "6382:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_app_data:/data

volumes:
  postgres_app_data:
  redis_app_data: