version: 1
metadata:
  name: digital-hub-oauth
  labels:
    blueprints.goauthentik.io/instantiate: "true"
    blueprints.goauthentik.io/description: |
      Digital Hub IdP - custom login/consent flows and the OAuth2/OIDC
      provider consumed by the Laravel app. The IdP UI itself is rendered by
      the Vue SPA in digital-hub-auth/web driving the flow executor API.

entries:
  # ------------------------------------------------------------------ #
  # Stages
  # ------------------------------------------------------------------ #
  - id: dh-identification
    model: authentik_stages_identification.identificationstage
    identifiers:
      name: Digital Hub - Identification
    attrs:
      user_fields:
        - username
        - email
      catch_user: false
      multiple_user: false
      case_insensitive: true
      enrollment_enabled: false
      recovery_enabled: true
      passwordless_allowed: false

  - id: dh-password
    model: authentik_stages_password.passwordstage
    identifiers:
      name: Digital Hub - Password
    attrs:
      backends:
        - authentik.core.auth.InbuiltBackend

  - id: dh-user-login
    model: authentik_stages_user_login.userloginstage
    identifiers:
      name: Digital Hub - User Login

  - id: dh-consent
    model: authentik_stages_consent.consentstage
    identifiers:
      name: Digital Hub - Consent
    attrs:
      # always_require => consent screen on every authorize call, which is
      # exactly what the Vue consent page handles.
      mode: always_require
      expire_in: 2592000

  # ------------------------------------------------------------------ #
  # Login flow: identification -> password -> user_login.
  # No authenticator_validate stage, so the SPA owns every visible step.
  # ------------------------------------------------------------------ #
  - id: flow-login
    model: authentik_flows.flow
    identifiers:
      slug: dh-login
    attrs:
      name: Digital Hub - Login
      title: Digital Hub
      designation: authentication
      layout: stacked
      denied_action: message_continue
      authentication: none

  - id: binding-identification
    model: authentik_flows.flowstagebinding
    identifiers:
      order: 10
      stage: !KeyOf dh-identification
      target: !KeyOf flow-login

  - id: binding-password
    model: authentik_flows.flowstagebinding
    identifiers:
      order: 20
      stage: !KeyOf dh-password
      target: !KeyOf flow-login

  - id: binding-user-login
    model: authentik_flows.flowstagebinding
    identifiers:
      order: 100
      stage: !KeyOf dh-user-login
      target: !KeyOf flow-login

  # ------------------------------------------------------------------ #
  # Consent (authorization) flow - consent stage only.
  # ------------------------------------------------------------------ #
  - id: flow-consent
    model: authentik_flows.flow
    identifiers:
      slug: dh-consent
    attrs:
      name: Digital Hub - Consent
      title: Digital Hub Authorization
      designation: authorization
      layout: stacked
      denied_action: message_continue

  - id: binding-consent
    model: authentik_flows.flowstagebinding
    identifiers:
      order: 10
      stage: !KeyOf dh-consent
      target: !KeyOf flow-consent

  # ------------------------------------------------------------------ #
  # OAuth2/OIDC provider + application.
  #
  # Order matters: the provider is created first, then the application is
  # linked to it via Application.provider. That link is what publishes the
  # provider at /application/o/digital-hub/.
  # ------------------------------------------------------------------ #
  - id: provider-digital-hub
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: Digital Hub OIDC
    attrs:
      authorization_flow: !KeyOf flow-consent
      authentication_flow: !KeyOf flow-login
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # Keep in sync with the Laravel client (config/services.php + .env).
      client_id: O0HJBTtNdphpxIl3qxXV56YucAVkqHs0hJTiSexq
      client_secret: !Env [DH_CLIENT_SECRET, dh-local-dev-secret-change-me]
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      refresh_token_validity: hours=1
      include_claims_in_id_token: true
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:9000/auth/callback
        - matching_mode: strict
          url: http://localhost:8080/auth/callback
      # Without these mappings userinfo returns 403 and the ID token has
      # no claims. UUIDs are the built-in "authentik default OAuth Mapping:
      # OpenID '<scope>'" entries; using them avoids !Find quote parsing.
      property_mappings:
        - 4b909c3d-12e3-4b35-9926-09135619f1da
        - 21584e3a-91d9-4196-8c78-86d7fe874cc1
        - b5cb4a1c-396a-4c6e-808e-f9fe522f1bd9
        # offline_access => the provider issues a refresh_token, which lets
        # the client survive the 5-minute access token lifetime.
        - b0780da9-1371-4073-93e5-0bce215e32a9

  - id: application-digital-hub
    model: authentik_core.application
    identifiers:
      slug: digital-hub
    attrs:
      name: Digital Hub
      provider: !KeyOf provider-digital-hub
      meta_description: Digital Hub Laravel application (OIDC client)

  # ------------------------------------------------------------------ #
  # Brand: default authentication flow = our custom flow, so an
  # unauthenticated authorize request lands on dh-login (driven by the
  # SPA) instead of authentik's built-in interface.
  # ------------------------------------------------------------------ #
  - id: brand-default
    model: authentik_brands.brand
    identifiers:
      default: true
    attrs:
      branding_title: Digital Hub
      flow_authentication: !KeyOf flow-login
      default_application: !KeyOf application-digital-hub